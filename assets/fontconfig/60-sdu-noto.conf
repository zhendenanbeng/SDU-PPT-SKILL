<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Map the template's font names to the Noto CJK families shipped by Linux distributions (fonts-noto-cjk). -->
<fontconfig>
  <alias binding="same">
    <family>Noto Serif SC</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Sans SC</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
</fontconfig>
